# How each app's command-line tool is started as a windowless MCP engine, and its default port.
#
#   port           default local port of the app's shared server
#   args           what follows `<app>-cli` (default: ["mcp"])
#   library        the engine works on a photo library chosen at start (`--library DIR`): the hub then
#                  starts it with none and gives the AI client library_list / library_open / library_close
#   settings       the app's settings folders (under the system's per-user settings folder), where its
#                  recent libraries are listed
#   root_flags     the flags that each take a folder the engine may read (first) and write (second);
#                  the hub passes the same folders to both. Absent: the engine can't be confined
#   multi_root     those flags may be repeated, for several folders
#   root_required  the engine has no file access at all without a folder
#
# An app that isn't listed here is probed when it is added (see `probe` in src/profiles.rs).

# Verified with the installed apps (Windows, November 2026). The folder flags were tested for each
# engine: with them it refuses to open or save outside the folders, without them it uses any file.

[photocraft]
port = 7801
root_flags = ["--automation-read-root", "--automation-write-root"]
root_required = true

[vectorcraft]
port = 7802
# Without --headless it looks for the desktop app first.
args = ["mcp", "--headless"]
root_flags = ["--automation-read-root", "--automation-write-root"]
multi_root = true

[lightcraft]
port = 7803
# --compact lists the helper tools only; every command stays reachable through run_command.
args = ["mcp", "--compact"]
library = true
settings = ["LightCraft"]

[pdfcraft]
port = 7804
root_flags = ["--automation-read-root", "--automation-write-root"]

[figcraft]
port = 7805
root_flags = ["--automation-read-root", "--automation-write-root"]
multi_root = true

[wordcraft]
port = 7806
root_flags = ["--automation-read-root", "--automation-write-root"]

[deckcraft]
port = 7807
root_flags = ["--automation-read-root", "--automation-write-root"]
multi_root = true

# No folder option in its command-line tool.
[gridcraft]
port = 7808

# No folder option either (it has its own --restricted mode, which the hub doesn't use).
[craft-anything]
port = 7810

# Not verified yet: only a default port, the arguments are probed from the tool's --help.

[filmcraft]
port = 7811
probe = true

[effectcraft]
port = 7812
probe = true

[anicraft]
port = 7813
probe = true

[designcraft]
port = 7814
probe = true

[soundcraft]
port = 7815
probe = true

[cadcraft]
port = 7816

[texturecraft]
port = 7817
probe = true

[materialcraft]
port = 7818
probe = true

[solidcraft]
port = 7819
args = ["mcp", "--headless"]
root_flags = ["--allow-path"]
multi_root = true

[mailcraft]
port = 7820
probe = true

[autocraft]
port = 7822
probe = true

# Apps from assets/extra-apps.toml.

# Started as `shapecraft-cli mcp`, as its author describes it; no folder option.
[shapecraft]
port = 7821
